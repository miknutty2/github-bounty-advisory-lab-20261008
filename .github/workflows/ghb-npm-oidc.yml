name: Harmless npm OIDC event-boundary test

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish_controlled_fixture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.body == 'GH_BOUNTY_NPM_OIDC_TRIGGER_20261010_942376D4')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.21.0
      - run: npm publish ./npm-oidc-fixture --access public --ignore-scripts
